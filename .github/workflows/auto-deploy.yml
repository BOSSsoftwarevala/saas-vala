# =====================================================
# ZERO-TOUCH AUTO DEPLOY - SELF-HOSTED RUNNER
# =====================================================
# NO SSH • NO MANUAL COMMANDS • FULLY AUTONOMOUS
# =====================================================

name: deploy-prod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, vps, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Navigate to project directory
        run: |
          cd /var/www/saas-vala || (git clone https://github.com/BOSSsoftwarevala/saas-vala.git /var/www/saas-vala && cd /var/www/saas-vala)

      - name: Pull latest code
        run: |
          cd /var/www/saas-vala
          git fetch --all
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd /var/www/saas-vala
          npm ci

      - name: Build project
        run: |
          cd /var/www/saas-vala
          npm run build

      - name: Kill existing processes
        run: |
          pkill -f "npm.*preview" || true
          pkill -f "vite" || true
          sleep 2

      - name: Restart with PM2
        run: |
          cd /var/www/saas-vala
          pm2 delete app || true
          pm2 start npm --name app -- run preview -- --port 8082
          pm2 save

      - name: Health check
        run: |
          sleep 5
          if lsof -i :8082 > /dev/null 2>&1; then
            echo "✅ App running on port 8082"
          else
            echo "❌ App not running on port 8082"
            pm2 logs --lines 50
            exit 1
          fi

      - name: Log deployment
        run: |
          echo "[$(date)] Deployment successful via self-hosted runner" >> /var/log/saas-vala/deploy.log
